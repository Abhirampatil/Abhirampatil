name: Metrics — Isometric Calendar

on:
  schedule:
    - cron: "0 0 * * *"     # regenerates daily at midnight UTC
  workflow_dispatch:          # run manually any time from Actions tab
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.svg

          # Only the isometric calendar plugin — no base stats
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year   # change to half-year if preferred
